<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>TH Store</title>

    <style>
        body {
            background: #1a1a1a;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 20px;
        }

        .btn-filtro {
            margin: 5px;
            padding: 10px;
            color: white;
            background: #333;
            border: 1px solid #444;
            cursor: pointer;
            font-size: 20px;
        }

        .btn-filtro.btn-ps1.active {
            background: #2d7b2d;
            border-color: #256022;
        }

        .btn-filtro.btn-ps2.active {
            background: #286b97;
            border-color: #225778;
        }

        .btn-filtro.btn-ps3.active {
            background: #bf7600;
            border-color: #995f00;
        }

        .btn-filtro.btn-todos.active {
            background: #cacaca;
            color: black;
            border-color: #444;
        }

        .btn-filtro.active {
            filter: brightness(0.95);
        }

        .card {
            display: block;
            background: #2a2a2a;
            margin: 10px;
            padding: 12px;
            border: 1px solid #444;
            text-align: left;
            color: white;
            text-decoration: none;
        }

        .card:hover {
            background: #333;
        }

        .row {
            display: block;
            width: 100%;
            overflow: hidden;
        }

        .name {
            float: left;
            font-weight: bold;
            max-width: 70%;
            word-break: break-word;
        }

        .size {
            float: right;
            color: #aaa;
        }

        .empty-message {
            margin-top: 20px;
            color: #ffcc00;
        }

        #loading {
            margin: 10px;
        }

        .btn-update {
            margin-top: 25px;
            padding: 12px 20px;
            background: #0078d7;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-update:hover {
            background: #005fa3;
        }

        .label-platform {
            display: inline-block;
            padding: 2px 8px;
            margin-right: 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .label-ps1 {
            background: #2d7b2d;
            color: #e6ffe6;
        }

        .label-ps2 {
            background: #286b97;
            color: #e8f5ff;
        }

        .label-ps3 {
            background: #bf7600;
            color: #fff3cc;
        }

        .label-unknown {
            background: #666;
            color: #f0f0f0;
        }
    </style>
</head>

<body>

<h2>Baixe arquivos .PKG para o PS3</h2>

<div>
    <button class="btn-filtro btn-todos active" onclick="filtrar('TODOS', this)">TODOS</button>
    <button class="btn-filtro btn-ps1" onclick="filtrar('PS1', this)">PS1</button>
    <button class="btn-filtro btn-ps2" onclick="filtrar('PS2', this)">PS2</button>
    <button class="btn-filtro btn-ps3" onclick="filtrar('PS3', this)">PS3</button>
</div>

<div id="loading">Carregando...</div>

<div id="lista-loja"></div>

<!--<button class="btn-update" onclick="atualizarPagina()">
    Atualizar Lista
</button>-->

<script>

var container = document.getElementById('lista-loja');
var loadingDiv = document.getElementById('loading');

var todosArquivos = [];
var filtroAtual = "TODOS";

function atualizarPagina() {

    loadingDiv.style.display = "block";
    loadingDiv.innerHTML = "Atualizando lista...";

    carregar();
}

function formatBytes(bytes) {

    bytes = parseInt(bytes || 0);

    if (!bytes) return "Desconhecido";

    var sizes = ["Bytes", "KB", "MB", "GB"];
    var i = 0;

    while (bytes >= 1024 && i < sizes.length - 1) {
        bytes = bytes / 1024;
        i++;
    }

    return Math.round(bytes * 100) / 100 + " " + sizes[i];
}

function filtrar(tipo, botao) {

    filtroAtual = tipo;

    var botoes = document.getElementsByClassName("btn-filtro");

    for (var i = 0; i < botoes.length; i++) {
        botoes[i].classList.remove("active");
    }

    botao.classList.add("active");

    renderizar();
}

function encodePathSegments(path) {
    return path.split("/").map(encodeURIComponent).join("/");
}

function displayName(name) {
    if (!name) return name;
    var index = name.indexOf("/");
    return index === -1 ? name : name.slice(index + 1);
}

function sortFiles(files) {
    files.sort(function (a, b) {
        return displayName(a.name).localeCompare(displayName(b.name), undefined, { sensitivity: 'base' });
    });
}

function renderizar() {

    container.innerHTML = "";

    var encontrados = 0;

    for (var i = 0; i < todosArquivos.length; i++) {

        var file = todosArquivos[i];

        if (!file.name) continue;

        if (file.name.toLowerCase().indexOf(".pkg") === -1)
            continue;

        if (filtroAtual !== "TODOS") {
            if (file.platform) {
                if (file.platform.toUpperCase() !== filtroAtual)
                    continue;
            } else {
                if (file.name.indexOf(filtroAtual + "/") !== 0)
                    continue;
            }
        }

        encontrados++;

        var link = file.download_url ||
            "https://archive.org/download/ps3_jogos/" + encodePathSegments(file.name);

        var badgeClass = file.platform ? file.platform.toLowerCase() : "unknown";
        var badgeText = file.platform ? file.platform : "UNK";
        var badge = "<span class='label-platform label-" + badgeClass + "'>" + badgeText + "</span>";

        var a = document.createElement("a");

        a.className = "card";
        a.href = link;
        a.target = "_blank";

        a.innerHTML =
            "<div class='row'>" +
                "<div class='name'>" + badge + displayName(file.name) + "</div>" +
                "<div class='size'>" + formatBytes(file.size) + "</div>" +
            "</div>";

        container.appendChild(a);
    }

    if (encontrados === 0) {

        container.innerHTML =
            "<div class='empty-message'>" +
            "Nenhum arquivo encontrado" +
            "</div>";
    }
}

function carregar() {

    loadingDiv.innerHTML = "Carregando...";

    var xhr = new XMLHttpRequest();

    xhr.open("GET", "./jogos.json", true);

    xhr.onreadystatechange = function () {

        if (xhr.readyState !== 4) return;

        if (xhr.status !== 200) {
            container.innerHTML = "Erro HTTP: " + xhr.status;
            return;
        }

        try {
            todosArquivos = JSON.parse(xhr.responseText);
        } catch (e) {
            container.innerHTML = "Erro JSON";
            return;
        }

        sortFiles(todosArquivos);
        loadingDiv.style.display = "none";

        renderizar();
    };

    xhr.send();
}

carregar();

</script>

</body>
</html>
